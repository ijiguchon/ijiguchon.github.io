<style>
:root{--color-primary:var(--color-primary);--color-accent:var(--color-accent);--color-background:var(--color-background);--color-surface:#ffffff;--color-border:var(--color-border);
--color-text-primary:var(--color-text-primary);--go-muted:#5f6572;--color-focus:#2c77b0;--font-sans:'Geist','Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--color-background);color:var(--color-text-primary);font-family:var(--font-sans);font-size:16px;line-height:1.5;word-break:keep-all}
a{color:inherit}
:focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}
main{max-width:520px;margin:0 auto;padding:24px 16px 32px}
.hd{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.hd img{width:44px;height:44px}
.hd b{display:block;font-size:20px;color:var(--color-primary);letter-spacing:-.01em}
.hd span{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;color:#7A5A23}
h1{margin:18px 0 4px;font-size:26px;line-height:1.3;color:var(--color-primary)}
.lead{margin:0 0 18px;color:var(--go-muted);font-size:15px}
.grid{display:grid;gap:10px}
.gb{display:flex;align-items:center;gap:14px;min-height:72px;padding:12px 14px;border-radius:16px;background:var(--color-surface);border:1px solid var(--color-border);
text-decoration:none;box-shadow:0 2px 8px rgba(20,33,61,.05);transition:border-color .15s ease,transform .15s ease}
.gb:hover{border-color:var(--color-accent)}
.gb:active{transform:scale(.99)}
.gi{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:#F3EAD8;color:var(--color-primary)}
.gi svg,.ga{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gt{flex:1;min-width:0}
.gt b{display:block;font-size:17px;color:var(--color-primary)}
.gt small{display:block;font-size:14px;color:var(--go-muted)}
.gt em{display:block;font-style:normal;font-size:12.5px;color:#7A5A23}
.ga{flex:none;width:20px;height:20px;color:var(--color-accent)}
.gb.first{background:var(--color-primary);border-color:var(--color-primary)}
.gb.first .gi{background:rgba(246,241,231,.14);color:var(--color-background)}
.gb.first b{color:var(--color-text-inverse)}.gb.first small{color:rgba(246,241,231,.85)}.gb.first em{color:#E9D4A8}
.ft{margin:20px 0 0;padding:14px 16px;border-radius:var(--radius-lg);border:1px dashed var(--color-border);text-align:center;font-size:15px}
.ft a{display:inline-flex;align-items:center;min-height:44px;font-weight:700;color:var(--color-primary)}
.ft small{display:block;color:var(--go-muted);font-size:13px}
.home{display:block;margin:16px 0 0;text-align:center;font-size:14px}
.home a{display:inline-flex;align-items:center;min-height:44px;color:var(--go-muted)}
@media (prefers-reduced-motion:reduce){.gb{transition:none}.gb:active{transform:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style id="hebron-ds">
/* HEBRON MASTER DESIGN SYSTEM v1.0 · Product theme: Church Website (시애틀지구촌교회) */
:root{
  /* Typography */
  --font-korean:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;

  --leading-heading:1.25; --leading-body:1.7; --leading-ui:1.5; --leading-caption:1.5;
  --tracking-display:-0.02em; --tracking-heading:-0.015em; --tracking-body:-0.005em; --tracking-ui:0;
  /* Color — semantic (Church theme: heritage navy · warm gold · cream) */
  --color-background:#F6F1E7; --color-background-secondary:#F1E6D3;
  --color-surface:#ffffff; --color-surface-muted:#FBF8F2;
  --color-text-primary:#1c1f26; --color-text-secondary:#4a4f5a; --color-text-muted:#7c8290;
  --color-text-disabled:#a9aeb8; --color-text-inverse:#ffffff;
  --color-border:#E3D9C6; --color-border-subtle:#EAE3D5; --color-border-strong:#D9C7A0;
  --color-primary:#14213d; --color-primary-hover:#1f2f55; --color-primary-active:#0d1730; --color-primary-foreground:#ffffff;
  --color-accent:#B8924A; --color-accent-hover:#8f6a2a; --color-accent-strong:#9A7130;
  --color-accent-bright:#CDA65B; --color-accent-deep:#A67A2E; --color-accent-on-dark:#E9C77B;
  --color-success:#12857c; --color-success-soft:#34c3b5; --color-warning:#B7791F;
  --color-error:#b4532a; --color-info:#2c4d8a; --color-info-soft:#5b7fb5;
  --color-focus:#2c77b0;
  --color-scripture:var(--color-primary);
  --color-brand-kakao:#FEE500; --color-brand-kakao-foreground:#3A1D1D;
  /* Spacing */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --space-10:40px; --space-12:48px; --space-16:64px; --space-20:80px; --space-24:96px; --space-32:128px;
  --space-xs:var(--space-1); --space-sm:var(--space-2); --space-md:var(--space-4); --space-lg:var(--space-6);
  --space-xl:var(--space-8); --space-2xl:var(--space-12); --space-3xl:var(--space-16);
  /* Radius */
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-xl:20px; --radius-pill:9999px;
  /* Shadow */
  --shadow-sm:0 1px 2px rgba(20,33,61,.06); --shadow-md:0 6px 18px rgba(40,30,10,.06); --shadow-lg:0 18px 40px rgba(20,33,61,.12);
  /* Layout (breakpoints: sm 560 · md 760 · lg 900 — CSS 변수는 media query에 못 쓰므로 값으로 사용) */
  --container-max:1200px; --container-reading:760px; --touch-target:44px;
  /* Motion · Layers */
  --transition-fast:.15s ease; --transition-base:.2s ease;
  --z-header:50; --z-dropdown:60; --z-floating:1100; --z-modal:1200;
}
html,body{font-family:var(--font-sans)}
body{font-weight:var(--weight-regular)}
button,input,select,textarea,optgroup{font-family:inherit}
code,pre,kbd,samp{font-family:var(--font-mono)}
:focus-visible{outline:3px solid var(--color-focus)!important;outline-offset:2px!important}
.host-acts a,.member .mct a,.bd-chip,.loc-go,.cb-acts button,.cb-more,.gm-x,.tm-i,.pgnav button,.d-settle,.ms-kakao,.dp-others a,.dp-hosp button{min-height:var(--touch-target)}

.psnav,.gc-send,.gc-x{min-width:var(--touch-target)}

.tabs .tab{min-height:40px} /* 예외: 모바일 헤더 높이 — 문서화됨 */

  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>

<script id="gmc-autoupdate">(function(){
if(!('serviceWorker' in navigator)||!window.fetch)return;
var V0=null,had=!!navigator.serviceWorker.controller,going=false;
function busy(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='search')return true;
var f=document.querySelectorAll('textarea,input:not([type=hidden]):not([type=search]):not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit])');
for(var i=0;i<f.length;i++){if(f[i].value&&f[i].value!==f[i].defaultValue)return true;}return false;}
function reload(){if(going||busy())return;try{var t=+sessionStorage.getItem('gmc-au')||0;if(Date.now()-t<15000)return;sessionStorage.setItem('gmc-au',Date.now());}catch(_){}
going=true;location.reload();}
navigator.serviceWorker.addEventListener('controllerchange',function(){if(had)reload();had=true;});
function upd(){return navigator.serviceWorker.getRegistration().then(function(g){if(g)return g.update();}).catch(function(){});}
function check(){fetch('/version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
if(!j||!j.v)return;if(V0===null){V0=j.v;return;}
if(j.v!==V0){V0=j.v;upd().then(function(){setTimeout(reload,4000);});}}).catch(function(){});}
function start(){navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).then(function(g){g.update();}).catch(function(){});check();}
if(document.readyState==='complete')start();else window.addEventListener('load',start);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check();});
window.addEventListener('pageshow',function(e){if(e.persisted)check();});
setInterval(function(){if(document.visibilityState==='visible')check();},20*60*1000);
})();</script>
