<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>출석 체크 · 시애틀지구촌교회</title>
<style>
  :root{--navy:#1a3560;--navy-2:#26407A;--gold:#C8944A;--ink:#1d2430;--ink-2:#48505e;--ink-3:#8a93a2;--cream:#FBF7F0;--line:#ECE6DC;--card:#fff;--ok:#1f9d63;--on:#2b6cb0;--r:16px;--r-sm:12px}
  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none!important}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;padding:0 0 40px}
  .en{display:none} body.lang-en .ko{display:none} body.lang-en .en{display:inline}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  header{background:linear-gradient(180deg,var(--navy-2),var(--navy));color:#fff;padding:20px 16px 22px;text-align:center;position:relative}
  .h-title{font-weight:900;font-size:20px}
  .h-sub{font-size:12.5px;opacity:.85;font-weight:600;margin-top:3px}
  .lang{position:absolute;top:18px;right:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;cursor:pointer}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;box-shadow:0 2px 10px rgba(26,53,96,.05)}
  .step{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--gold);margin-bottom:10px}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1 1 70px;border:1.5px solid var(--line);background:#fff;color:var(--ink-2);border-radius:var(--r-sm);padding:12px 8px;font-size:13.5px;font-weight:800;cursor:pointer}
  .seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  input[type=text]{width:100%;font-size:16px;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px;margin-bottom:10px}
  input:focus{outline:none;border-color:var(--navy-2)}
  .names{display:flex;flex-wrap:wrap;gap:8px}
  .nb{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:11px 16px;font-size:15px;font-weight:800;cursor:pointer}
  .nb.on{background:var(--gold);border-color:var(--gold);color:#fff}
  .mode{display:flex;gap:10px}
  .mode button{flex:1;border:2px solid var(--line);background:#fff;color:var(--ink-2);border-radius:var(--r-sm);padding:16px;font-size:16px;font-weight:900;cursor:pointer}
  .mode button.on[data-v="대면"]{background:var(--ok);border-color:var(--ok);color:#fff}
  .mode button.on[data-v="온라인"]{background:var(--on);border-color:var(--on);color:#fff}
  .go{width:100%;margin-top:16px;background:linear-gradient(180deg,#E4A85C,#C8843A);color:#fff;border:0;border-radius:999px;padding:17px;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 6px 16px rgba(200,132,58,.34)}
  .go:disabled{opacity:.5;box-shadow:none}
  .empty{color:var(--ink-3);text-align:center;padding:16px;font-size:14px}
  .demo{display:inline-block;background:#FDECEC;color:#b23b3b;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;margin-left:6px}
  .done{text-align:center;padding:56px 16px}
  .done .big{font-size:52px;margin-bottom:10px}
  .done h2{color:var(--navy);font-size:24px;margin-bottom:8px}
  .done p{color:var(--ink-2);font-size:16px}
  .again{margin-top:22px;background:#fff;border:1.5px solid var(--navy);color:var(--navy);border-radius:999px;padding:12px 22px;font-size:14px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="h-title"><span class="ko">출석 체크</span><span class="en">Check In</span></div>
  <div class="h-sub">시애틀지구촌교회 · GMC of Greater Seattle</div>
  <button class="lang" id="langBtn" style="display:inline-flex;align-items:center;gap:5px" aria-label="Language / 언어"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;opacity:.85"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></svg><span id="langTxt">EN</span></button>
</header>

<div class="wrap" id="app">
  <div class="card">
    <div class="step"><span class="ko">1. 오늘 어느 모임인가요?</span><span class="en">1. Which meeting today?</span><span class="demo" id="demoTag" hidden>데모</span></div>
    <div class="seg" id="ctxSeg">
      <button type="button" data-c="주일연합예배" class="on"><span class="ko">주일예배</span><span class="en">Sunday</span></button>
      <button type="button" data-c="토요기도회"><span class="ko">토요기도회</span><span class="en">Sat. Prayer</span></button>
      <button type="button" data-c="목장모임"><span class="ko">목장</span><span class="en">Mokjang</span></button>
      <button type="button" data-c="특별행사"><span class="ko">특별행사</span><span class="en">Special</span></button>
    </div>
    <div id="eventWrap" hidden style="margin-top:10px">
      <input type="text" id="eventInp" placeholder="행사 이름 (예: 세겹줄기도회)"/>
    </div>
  </div>

  <div class="card">
    <div class="step"><span class="ko">2. 이름을 찾아 눌러 주세요</span><span class="en">2. Tap your name</span></div>
    <input type="text" id="search" placeholder="이름 검색 / Search"/>
    <div class="names" id="names"><div class="empty" id="loading"><span class="ko">불러오는 중…</span><span class="en">Loading…</span></div></div>
    <button class="nb" id="visitorBtn" style="border-style:dashed;margin-top:10px"><span class="ko">처음 오셨나요? · 명단에 없어요</span><span class="en">First time? · Not on the list</span></button>
    <div id="visitorWrap" hidden style="margin-top:10px">
      <input type="text" id="visitorName" placeholder="이름을 적어 주세요 / Your name"/>
    </div>
  </div>

  <div class="card">
    <div class="step"><span class="ko">3. 어떻게 참석하시나요?</span><span class="en">3. How are you attending?</span></div>
    <div class="mode" id="modeSeg">
      <button type="button" data-v="대면"><span class="ko">대면</span><span class="en">In-person</span></button>
      <button type="button" data-v="온라인"><span class="ko">온라인</span><span class="en">Online</span></button>
    </div>
  </div>

  <button class="go" id="goBtn" disabled><span class="ko">출석 체크하기</span><span class="en">Check in</span></button>
  <div style="text-align:center;margin-top:16px"><a href="../worship/" style="color:var(--navy-2);font-size:13px;font-weight:800;text-decoration:none"><span class="ko">목자·스탭이 대신 체크하기 →</span><span class="en">Leader/staff check for others →</span></a></div>
</div>

<div class="wrap" id="doneArea" hidden>
  <div class="done">
    <div class="big">✓</div>
    <h2 id="doneName"></h2>
    <p><span class="ko">출석이 확인되었습니다. 함께해 주셔서 감사합니다!</span><span class="en">You're checked in. Thank you for joining!</span></p>
    <button class="again" id="againBtn"><span class="ko">다른 사람 체크</span><span class="en">Check another</span></button>
  </div>
</div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzt_mgY8y0IzwKmFGm7Qytg4ryF76cZD9NqnI3BNnyvNqgEVYI5fKsreqjh_1SyYwAR/exec';
const $=(id)=>document.getElementById(id);
let lang='ko', ctx='주일연합예배', ADULTS={}, chosen=null, mode=null, nameMokjang={}, isVisitor=false;

$('langBtn').onclick=()=>{ lang=(lang==='ko')?'en':'ko'; document.body.classList.toggle('lang-en',lang==='en'); $('langTxt').textContent=lang==='ko'?'EN':'한국어'; $('demoTag').textContent=lang==='ko'?'데모':'Demo'; };

function defaultCtx(){ const g=new Date().getDay(); return g===6?'토요기도회':'주일연합예배'; }
function nearestSunday(){ const d=new Date();const g=d.getDay();if(g!==0)d.setDate(d.getDate()-g);return d.toISOString().slice(0,10);}
function nearestSaturday(){ const d=new Date();const g=d.getDay();d.setDate(d.getDate()-((g+1)%7));return d.toISOString().slice(0,10);}
function ctxDate(){ return ctx==='주일연합예배'?nearestSunday():(ctx==='토요기도회'?nearestSaturday():new Date().toISOString().slice(0,10)); }

$('ctxSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ ctx=b.dataset.c; $('ctxSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); $('eventWrap').hidden=(ctx!=='특별행사'); check(); });
$('modeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ mode=b.dataset.v; $('modeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); check(); });
$('search').addEventListener('input',renderNames);

function renderNames(){
  const q=$('search').value.trim(); const box=$('names');
  const all=Object.keys(nameMokjang);
  const list=q?all.filter(n=>n.toLowerCase().includes(q.toLowerCase())):all;
  box.innerHTML='';
  if(!list.length){ box.innerHTML='<div class="empty">'+(lang==='ko'?'명단이 없습니다. 목자·스탭에게 문의하세요.':'No names yet. Ask a leader.')+'</div>'; return; }
  list.forEach(n=>{ const b=document.createElement('button'); b.className='nb'+(chosen===n?' on':''); b.textContent=n;
    b.onclick=()=>{ chosen=(chosen===n)?null:n; isVisitor=false; $('visitorWrap').hidden=true; $('visitorName').value=''; $('visitorBtn').classList.remove('on'); box.querySelectorAll('.nb').forEach(x=>x.classList.toggle('on',x.textContent===chosen)); check(); }; box.appendChild(b); });
}
function check(){ $('goBtn').disabled=!(chosen&&mode); }

// 방문자 · 명단에 없는 분 자가체크
$('visitorBtn').onclick=()=>{ isVisitor=true; $('visitorWrap').hidden=false; $('visitorBtn').classList.add('on');
  $('names').querySelectorAll('.nb').forEach(x=>x.classList.remove('on')); chosen=null; $('visitorName').focus(); check(); };
$('visitorName').addEventListener('input',()=>{ chosen=$('visitorName').value.trim()||null; check(); });

$('goBtn').onclick=async()=>{
  if(!chosen||!mode) return;
  let 구분=ctx; if(ctx==='특별행사'){ 구분=$('eventInp').value.trim(); if(!구분){ alert(lang==='ko'?'행사 이름을 적어 주세요.':'Enter event name.'); return; } }
  const mk=isVisitor?'방문자':((ctx==='목장모임')?(nameMokjang[chosen]||'미배정'):'(전체)');
  const payload={type:'worship',구분:구분,목장:mk,날짜:ctxDate(),기록자:isVisitor?'방문자(자가체크)':'본인(자가체크)',records:[{이름:chosen,상태:mode}]};
  $('goBtn').disabled=true;
  try{
    if(SCRIPT_URL) await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    $('doneName').textContent=(lang==='ko')?(chosen+'님, 출석되었습니다!'):(chosen+', checked in!');
    $('app').hidden=true; $('doneArea').hidden=false; window.scrollTo(0,0);
  }catch(e){ alert(lang==='ko'?'전송 실패 — 다시 시도해 주세요.':'Failed — try again.'); $('goBtn').disabled=false; }
};
$('againBtn').onclick=()=>{ chosen=null; mode=null; isVisitor=false; $('search').value=''; $('visitorWrap').hidden=true; $('visitorName').value=''; $('visitorBtn').classList.remove('on'); $('modeSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on')); renderNames(); check(); $('doneArea').hidden=true; $('app').hidden=false; };

async function loadAdults(){
  if(!SCRIPT_URL){ $('demoTag').hidden=false; nameMokjang={'김성수':'미배정','이인규':'인도네시아'}; return; }
  try{ const r=await fetch(SCRIPT_URL+'?list=adults'); const j=await r.json(); if(j&&j.ok&&j.mokjangs){ ADULTS=j.mokjangs; Object.keys(ADULTS).forEach(mk=>ADULTS[mk].forEach(n=>{ nameMokjang[n]=mk; })); } }catch(e){}
}
(async function init(){ ctx=defaultCtx(); $('ctxSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.c===ctx)); await loadAdults(); renderNames(); })();
</script>
</body>
</html>
