<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토요가족기도모임 · 시애틀지구촌교회</title>
<meta name="description" content="시애틀지구촌교회 토요가족기도모임 — 매주 토요일 오전 6시. 이번 주 순서, 찬송, 말씀, 기도제목.">
<link rel="canonical" href="https://www.ijiguchon.org/saturday/">
<link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192-r.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon-r.png">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{--cream:#F6F1E7;--ink:#14213d;--ink2:#48505e;--muted:#5F6573;--line:#e3dccd;--gold:#B8924A;--gold2:#826028;--sun:#f2a541;--card:#fff;--tint:#fbf7ef;--font-sans:'Pretendard Variable',Pretendard,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font-sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 56px max(16px,env(safe-area-inset-right))}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;font-weight:800;font-size:14px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.brand img{width:34px;height:34px;border-radius:50%}
.pill{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ink2);text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
header.hero{text-align:center;padding:30px 0 20px}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--gold2);font-weight:800;text-transform:uppercase}
h1{font-size:30px;margin:8px 0 6px;font-weight:800;letter-spacing:-.01em}
.rule{width:44px;height:2px;background:var(--gold);margin:12px auto}
.date{color:var(--ink2);font-size:15px;font-weight:600}
.lead{color:var(--ink2);font-size:14px;margin:10px auto 0;max-width:34em;word-break:keep-all}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px;font-weight:800}
.card h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sun);color:var(--ink);font-size:12px;font-weight:800}
.card h2 .tag{font-size:12px;font-weight:500;color:var(--muted);margin-left:auto}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font-variant-numeric:tabular-nums;font-weight:800}
.row .what{font-weight:600}
.row .what small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.row .h{font-size:13px;color:var(--ink2);white-space:nowrap}
.row .what .hy{display:grid;gap:6px;margin-top:7px}
.row .what .hy a,.row .what .hy span.nolink{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;text-decoration:none;color:inherit;background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13.5px;font-weight:600;min-height:40px}
.row .what .hy b{font-size:16px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:baseline;gap:1px}
.row .what .hy b small{font-size:11px;color:var(--gold2);font-weight:700}
.row .what .hy .ti{min-width:0;word-break:keep-all}
.row .what .hy em{font-style:normal;font-size:11.5px;color:var(--muted);margin-left:4px;white-space:nowrap}
.row .what .hy .sc{font-size:10.5px;font-weight:700;color:var(--gold2);border:1px solid var(--gold);border-radius:999px;padding:1px 7px;white-space:nowrap}
.row .what .hy a:hover,.row .what .hy a:focus-visible{background:#f3ecdc}
.row .what .pr{margin:8px 0 2px;padding:0;list-style:none;display:grid;gap:6px}
.row .what .pr li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:14px;font-weight:400;word-break:keep-all;line-height:1.5}
.row .what .pr li i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--sun);color:var(--ink);font-size:11px;font-weight:800;display:grid;place-items:center;margin-top:2px}
.row .what .pr li .blank{color:var(--muted);border-bottom:1px dashed var(--line)}
.row .what .pr li .ref{color:var(--muted);font-size:12px;margin-left:4px}
.row .what .how{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--gold2);background:var(--tint);border-radius:999px;padding:2px 9px}
.row.scr-row{grid-template-columns:52px 1fr auto}
.row .scr2{grid-column:1/-1;display:block;margin:4px 0 2px;background:var(--ink);color:#e8ecf7;border-radius:14px;padding:18px 18px 20px;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(20,33,61,.18)}
.row .scr2::after{content:"";position:absolute;right:-36px;bottom:-52px;width:130px;height:130px;border-radius:50%;background:var(--sun);opacity:.92}
.row .scr2 .ey{display:block;position:relative;font-size:11px;letter-spacing:.16em;color:var(--sun);font-weight:800;text-transform:uppercase}
.row .scr2 b{display:block;position:relative;font-size:22px;line-height:1.3;font-weight:800;margin:6px 0 6px;word-break:keep-all;max-width:85%}
.row .scr2 span{display:block;position:relative;font-size:14px;color:#c9d2ef;word-break:keep-all;font-weight:400;max-width:85%}
.row .t{align-self:start;padding-top:2px}
.hymns{display:grid;gap:8px}
.hymn{display:grid;grid-template-columns:62px 62px 1fr;gap:8px;align-items:center;background:var(--tint);border-radius:10px;padding:10px 12px;min-width:0}
.hymn .ht{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px}
.hymn .ht small{display:block;font-weight:600;font-size:11px;color:var(--gold2);white-space:nowrap}
.hymn b{font-size:24px;line-height:1.1;font-weight:800}
.hymn b small{font-size:12px;font-weight:700;color:var(--gold2);margin-left:2px}
.hymn .hn{min-width:0}
.hymn span.ti{font-size:14px;font-weight:600;display:block}
.hymn em{font-style:normal;font-size:11.5px;color:var(--muted)}
a.hymn{text-decoration:none;color:inherit;position:relative;cursor:pointer;padding-right:56px}
a.hymn::after{content:"악보";position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:700;color:var(--gold2);border:1px solid var(--gold);border-radius:999px;padding:1px 7px}
a.hymn:hover,a.hymn:focus-visible{background:#f3ecdc}
.lb{position:fixed;inset:0;z-index:1000;background:rgba(10,16,32,.92);display:flex;flex-direction:column}
.lb[hidden]{display:none}
.lb .lb-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;color:#fff;font-weight:700}
.lb .lb-h a{color:#f2a541;font-size:13px;text-decoration:underline}
.lb button{min-width:44px;min-height:44px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.lb .lb-b{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 0 max(16px,env(safe-area-inset-bottom))}
.lb img{display:block;width:100%;max-width:900px;margin:0 auto;background:#fff}
.lb .lb-s{color:#c9d2ef;text-align:center;padding:40px 16px}
.scr{background:var(--ink);color:#e8ecf7;border-radius:14px;padding:20px;margin-top:14px;position:relative;overflow:hidden}
.scr::after{content:"";position:absolute;right:-40px;bottom:-60px;width:150px;height:150px;border-radius:50%;background:var(--sun);opacity:.9}
.scr .eyebrow{color:var(--sun)}
.scr h2{font-size:23px;margin:6px 0 4px;position:relative;font-weight:800}
.scr p{margin:0;color:#c9d2ef;font-size:14px;position:relative;max-width:22em;word-break:keep-all}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin:0 0 8px}
.meta+.meta{margin-top:16px}.meta b{color:var(--gold2)}
ol.pr{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:8px}
ol.pr:last-child{margin-bottom:0}
ol.pr li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14.5px;word-break:keep-all}
ol.pr li i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--sun);color:var(--ink);font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:2px}
ol.pr li .blank{color:var(--muted);border-bottom:1px dashed var(--line)}
ol.pr li .ref{color:var(--muted);font-size:12px;margin-left:4px}
.links{display:grid;gap:10px;margin-top:14px}
.link{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;min-height:44px}
.link strong{display:block;font-size:14.5px}.link span{display:block;font-size:12.5px;color:var(--muted)}
.link .arrow{font-size:18px;flex:none}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:26px;line-height:1.7;word-break:keep-all}
.share{margin-top:18px;background:var(--card,#fff);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.share h3{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.share .sb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.share .sb{grid-template-columns:repeat(2,1fr)}}
.share button,.share a{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--tint,#fbf7ef);color:var(--ink);font:700 13.5px inherit;font-family:inherit;text-decoration:none;cursor:pointer;padding:8px 10px}
.share button:hover,.share a:hover{background:#f3ecdc}
.share .pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.share svg{width:18px;height:18px;flex:none}
.share .msg{font-size:12.5px;color:var(--muted);margin:8px 0 0;min-height:1.2em}
.state{text-align:center;color:var(--muted);padding:40px 0}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/"><img src="/images/logo-mark-96.webp" alt="" width="34" height="34"><span>시애틀지구촌교회<small>토요가족기도모임</small></span></a>
    <a class="pill" href="/?tab=worship">예배 안내 ›</a>
  </div>
  <div id="app"><p class="state">이번 주 순서를 불러오는 중입니다…</p></div>
</div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="악보">
  <div class="lb-h"><span id="lb-t"></span><span><a id="lb-dl" href="#" target="_blank" rel="noopener">드라이브에서 열기</a> &nbsp; <button type="button" id="lb-x" aria-label="닫기">닫기 ✕</button></span></div>
  <div class="lb-b" id="lb-b"></div>
</div>

<script>
/* 토요가족기도모임 — 내 드라이브 › 02_GMC 공개자료_웹앱 › 토요기도모임 폴더의 MMDDYY_토요가족기도모임.json 을 읽어 그린다.
   JSON 구조: 같은 폴더의 _schema_토요가족기도모임.md */
var GDRIVE_API_KEY = 'AIzaSyBL3EXN_i8b9RkcXPa4x_FD2M3sKTQpVgY';
var SATURDAY_FOLDER = '17kLNfm_S_m77zX_QDaxYFcb3Ia7ufiFg';

var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
function kdate(iso){ var d=new Date(iso+'T00:00:00'); return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+'일월화수목금토'[d.getDay()]+'요일'; }
function mdate(iso){ var d=new Date(iso+'T00:00:00'); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function hm(t){ return String(t||'').replace(/^0/,''); }
var circ=['','①','②','③'];
function targetSaturday(){ var d=new Date(); var n=new Date(d); n.setDate(d.getDate()+((6-d.getDay()+7)%7)); return n; } // 오늘이 토요일이면 오늘
function mmddyy(d){ var p=function(n){return (n<10?'0':'')+n;}; return p(d.getMonth()+1)+p(d.getDate())+String(d.getFullYear()).slice(2); }
function isoFromId(id){ return '20'+id.slice(4,6)+'-'+id.slice(0,2)+'-'+id.slice(2,4); }

async function listJson(){
  var q="'"+SATURDAY_FOLDER+"' in parents and trashed=false and mimeType='application/json'";
  var r=await fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&key='+GDRIVE_API_KEY+'&fields='+encodeURIComponent('files(id,name)')+'&pageSize=200');
  if(!r.ok) throw new Error('list '+r.status);
  var j=await r.json(); return (j.files||[]).filter(function(f){ return /^\d{6}_토요가족기도모임\.json$/.test(f.name); });
}
async function loadData(){
  var files=await listJson(); if(!files.length) return null;
  var want=mmddyy(targetSaturday());
  var pick=files.filter(function(f){return f.name.slice(0,6)===want;})[0];
  if(!pick){ files.sort(function(a,b){ return isoFromId(b.name.slice(0,6)).localeCompare(isoFromId(a.name.slice(0,6))); }); pick=files[0]; }
  var r=await fetch('https://www.googleapis.com/drive/v3/files/'+pick.id+'?alt=media&key='+GDRIVE_API_KEY,{cache:'no-store'});
  if(!r.ok) throw new Error('get '+r.status);
  return await r.json();
}

var SCORE_FOLDER='1-pvJPwjgOWYqVn3NY-BDUigkln8iMkwE', scoreMap={};
async function loadScores(){
  try{
    var q="'"+SCORE_FOLDER+"' in parents and trashed=false and mimeType contains 'image/'";
    var r=await fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&key='+GDRIVE_API_KEY+'&fields='+encodeURIComponent('files(id,name)')+'&pageSize=300');
    if(!r.ok) return; var j=await r.json();
    (j.files||[]).forEach(function(f){ var m=/^(\d{1,3})/.exec(f.name); if(m&&!scoreMap[+m[1]]) scoreMap[+m[1]]=f.id; });
  }catch(e){}
}
var lbUrl=null;
function openScore(no,title,fid){
  var lb=document.getElementById('lb'), body=document.getElementById('lb-b');
  document.getElementById('lb-t').textContent=no+'장 '+title;
  document.getElementById('lb-dl').href='https://drive.google.com/file/d/'+fid+'/view';
  body.innerHTML='<p class="lb-s">악보를 불러오는 중입니다…</p>'; lb.hidden=false; document.body.style.overflow='hidden';
  fetch('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media&key='+GDRIVE_API_KEY).then(function(r){ if(!r.ok) throw 0; return r.blob(); }).then(function(bl){
    if(lbUrl) URL.revokeObjectURL(lbUrl); lbUrl=URL.createObjectURL(bl);
    body.innerHTML='<img alt="'+esc(no)+'장 '+esc(title)+' 악보" src="'+lbUrl+'">';
  }).catch(function(){ body.innerHTML='<p class="lb-s">여기서는 열리지 않습니다. 위의 「드라이브에서 열기」를 눌러 주세요.</p>'; });
}
function closeScore(){ document.getElementById('lb').hidden=true; document.body.style.overflow=''; }
document.getElementById('lb-x').addEventListener('click',closeScore);
document.getElementById('lb').addEventListener('click',function(e){ if(e.target.id==='lb'||e.target.id==='lb-b') closeScore(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeScore(); });
function initShare(){
  var url=location.origin+location.pathname, title=document.title, msg=document.getElementById('sh-msg');
  function say(t){ msg.textContent=t; }
  document.getElementById('sh-fb').href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url);
  document.getElementById('sh-th').href='https://www.threads.net/intent/post?text='+encodeURIComponent(title+' '+url);
  document.getElementById('sh-native').addEventListener('click',async function(){
    if(navigator.share){ try{ await navigator.share({title:title,url:url}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
    copy('이 기기에는 공유창이 없어 주소를 복사했습니다. 카톡에 붙여넣어 보내 주세요.');
  });
  document.getElementById('sh-copy').addEventListener('click',function(){ copy('주소를 복사했습니다. 인스타그램·카톡에 붙여넣어 보내 주세요.'); });
  async function copy(ok){ try{ await navigator.clipboard.writeText(url); say(ok); }catch(e){ window.prompt('아래 주소를 복사해 주세요', url); } }
}
function render(d){
  var byNo={}; (d.hymns||[]).forEach(function(h){ byNo[+h.no]=h; });
  var chip=function(no){ var h=byNo[+no]||{no:no,title:''}; var fid=scoreMap[+no];
    var inner='<b>'+esc(h.no)+'<small>장</small></b><span class="ti">'+esc(h.title)+(h.verses?'<em>'+esc(h.verses)+'</em>':'')+'</span>';
    return fid?'<a href="https://drive.google.com/file/d/'+esc(fid)+'/view" data-no="'+esc(h.no)+'" data-title="'+esc(h.title)+'" data-fid="'+esc(fid)+'">'+inner+'<span class="sc">악보</span></a>':'<span class="nolink">'+inner+'<span></span></span>'; };
  var order=(d.order||[]).map(function(o){ var hy=(o.hymns&&o.hymns.length)?'<span class="hy">'+o.hymns.map(chip).join('')+'</span>':'';
    var detail=o.detail||''; if(o.hymns&&o.hymns.length){ detail = detail.indexOf('→')>=0 ? detail.split('→').slice(1).join('→').trim() : (/^\s*\d{1,3}장/.test(detail) ? '' : detail); }
    var extra='';
    if(o.round){ var r=(d.prayerRounds||[]).filter(function(x){return x.no===o.round;})[0];
      if(r){ extra='<ol class="pr">'+(r.items||[]).map(function(it,i){ return '<li><i>'+(i+1)+'</i><span class="'+(it.blank?'blank':'')+'">'+esc(it.text)+(it.ref?'<span class="ref">('+esc(it.ref)+')</span>':'')+'</span></li>'; }).join('')+'</ol>'; } }
    var tail='';
    if(/말씀/.test(o.name)&&d.scripture){ var sc=d.scripture; tail='<span class="scr2"><span class="ey">말씀 · '+esc(sc.refLong||sc.ref||'')+'</span><b>'+esc(sc.title||'')+'</b><span>'+esc(sc.proposition||'')+(sc.summary?'. '+esc(sc.summary):'')+'</span></span>'; detail=''; }
    return '<div class="row"><span class="t">'+esc(hm(o.time))+'</span><span class="what">'+esc(o.name)+(detail?'<small>'+esc(detail)+'</small>':'')+hy+extra+'</span><span class="h">'+esc(o.minutes)+'분</span>'+tail+'</div>'; }).join('');
  var links='';
  links+='<a class="link" href="/square/news/"><div><strong>'+(d.links&&d.links.sundayBulletinId?mdate(isoFromId(d.links.sundayBulletinId))+' ':'')+'주일 교회 소식</strong><span>주일연합예배 오후 1:30 · 주보</span></div><span class="arrow">›</span></a>';
  var s=d.scripture||{}, nw=d.nextWeek||{}, m=d.meeting||{};
  document.getElementById('app').innerHTML=
    '<header class="hero"><div class="eyebrow">Saturday Family Prayer</div><h1>'+esc(m.name||'토요가족기도모임')+'</h1><div class="rule"></div>'+
    '<div class="date">'+esc(kdate(d.date))+' · 오전 '+esc(hm(m.start||'06:00'))+' – '+esc(hm(m.end||'06:50'))+'</div>'+
    '<p class="lead">'+esc(d.intro||'')+'</p></header>'+
    '<section class="card"><h2>오늘의 순서<span class="tag">찬송을 누르면 악보</span></h2>'+order+'</section>'+
    '<div class="links">'+links+'</div>'+
