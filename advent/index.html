var grid=document.getElementById('grid'), panel=document.getElementById('panel'), cur=-1;
var LOCK='<svg class="lk" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
DAYS.forEach(function(d,i){
  var open=preview||d[0]<=today, b=document.createElement('button');
  b.type='button';b.className='door';b.style.setProperty('--tc',TC[d[1]]);
  b.innerHTML='<span class="bar"></span><span class="n">'+(i+1)+'</span><span class="d">'+sd(d[0])+'</span>'+(open?'':LOCK);
  if(!open){b.disabled=true;b.setAttribute('aria-label',(i+1)+' '+sd(d[0])+' · '+md(d[0])+'에 열립니다');}
  else{b.setAttribute('aria-label',(i+1)+' '+sd(d[0])+' · '+d[1]+' · '+md(d[0]));b.setAttribute('aria-controls','panel');b.setAttribute('aria-expanded','false');b.onclick=function(){show(i);};}
  if(d[0]===today)b.classList.add('today');if(seen[d[0]])b.classList.add('seen');
  grid.appendChild(b);
});
function show(i){
  var d=DAYS[i], bs=grid.querySelectorAll('.door');
  bs.forEach(function(x,k){x.classList.toggle('on',k===i);if(!x.disabled)x.setAttribute('aria-expanded',k===i?'true':'false');});
  panel.style.background=TC[d[1]].indexOf('xmas')>-1?'var(--color-primary)':'';
  panel.innerHTML='<div class="pe">'+(i+1)+'번째 문 · '+md(d[0])+' · '+esc(d[1])+'</div><h2>'+esc(d[2])+'</h2>'
    +'<p class="ql">함께 나눌 질문</p><p class="q">'+esc(d[4])+'</p>'
    +'<div class="btns"><a class="k" href="https://www.bible.com/ko/bible/142/'+d[3]+'.RNKSV" target="_blank" rel="noopener">새번역으로 읽기</a>'
    +'<a class="e" href="https://www.bible.com/bible/59/'+d[3]+'.ESV" target="_blank" rel="noopener">ESV로 읽기</a></div>';
  panel.hidden=false;seen[d[0]]=1;save();bs[i].classList.add('seen');cur=i;
  if(panel.getBoundingClientRect().top>innerHeight*0.6)panel.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
}
var w=document.getElementById('wait');
if(!preview&&today<DAYS[0][0]){var days=Math.ceil((new Date(DAYS[0][0]+'T00:00:00')-new Date(today+'T00:00:00'))/864e5);w.innerHTML='<b>'+md(DAYS[0][0])+'</b>, 첫 문이 열립니다. 앞으로 '+days+'일 남았습니다.';w.hidden=false;}
var ti=-1;DAYS.forEach(function(d,i){if(d[0]<=today||preview)ti=i;});if(preview)ti=DAYS.findIndex(function(d){return d[0]===today;});
if(ti>=0&&(preview||DAYS[ti][0]===today))show(ti);
})();
</script>
<script id="gmc-autoupdate">(function(){
if(!('serviceWorker' in navigator)||!window.fetch)return;
var V0=null,had=!!navigator.serviceWorker.controller,going=false;
function busy(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='search')return true;
var f=document.querySelectorAll('textarea,input:not([type=hidden]):not([type=search]):not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit])');
for(var i=0;i<f.length;i++){if(f[i].value&&f[i].value!==f[i].defaultValue)return true;}return false;}
function reload(){if(going||busy())return;try{var t=+sessionStorage.getItem('gmc-au')||0;if(Date.now()-t<15000)return;sessionStorage.setItem('gmc-au',Date.now());}catch(_){}
going=true;location.reload();}
navigator.serviceWorker.addEventListener('controllerchange',function(){if(had)reload();had=true;});
function upd(){return navigator.serviceWorker.getRegistration().then(function(g){if(g)return g.update();}).catch(function(){});}
function check(){fetch('/version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
if(!j||!j.v)return;if(V0===null){V0=j.v;return;}
if(j.v!==V0){V0=j.v;upd().then(function(){setTimeout(reload,4000);});}}).catch(function(){});}
function start(){navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).then(function(g){g.update();}).catch(function(){});check();}
if(document.readyState==='complete')start();else window.addEventListener('load',start);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check();});
window.addEventListener('pageshow',function(e){if(e.persisted)check();});
setInterval(function(){if(document.visibilityState==='visible')check();},20*60*1000);
})();</script>
