<style>
:root{--color-background:#F6F1E7;--color-surface:#ffffff;--color-text-primary:#1c1f26;--color-text-secondary:#4a4f5a;
  --color-border:#E3D9C6;--color-primary:#14213d;--color-primary-hover:#1f2f55;--color-primary-foreground:#ffffff;--color-accent:#B8924A;
  --font-sans:"Pretendard Variable",Pretendard,"Geist",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:var(--color-background);color:var(--color-text-primary);font-family:var(--font-sans);line-height:1.6;word-break:keep-all}

nav{display:flex;flex-direction:column;gap:10px}
a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;border-radius:12px;
  font-size:16px;font-weight:600;text-decoration:none;border:1px solid var(--color-border);color:var(--color-primary)}
a.main{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-primary-foreground)}
a:hover{border-color:var(--color-primary)}
a.main:hover{background:var(--color-primary-hover)}
a:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}
.en{font-size:14px;margin-top:20px;margin-bottom:0}
</style>
<!-- 휴대폰 글자 --><style id="mt-css">.ts-btn{display:none}@media (max-width:767px){html.ts1{-webkit-text-size-adjust:115%!important;text-size-adjust:115%!important}html.ts2{-webkit-text-size-adjust:130%!important;text-size-adjust:130%!important}html.ts3{-webkit-text-size-adjust:145%!important;text-size-adjust:145%!important}html.ts1 body,html.ts2 body,html.ts3 body{overflow-wrap:break-word}.topbar,.top,header,.ts-keep{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}.ts-btn+*>svg{display:none}.ts-btn+*{min-width:44px;padding-left:8px!important;padding-right:8px!important}.ts-btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 6px;margin-right:2px;border:0;border-radius:999px;background:transparent;color:inherit;font:inherit;font-size:15px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}.ts-btn:focus-visible{outline:3px solid var(--color-accent,#B8924A);outline-offset:2px}}</style><script id="mt-js">(function(){
var MODE='test',q=location.search;
try{if(/[?&]big=1/.test(q))localStorage.setItem('gmc-ts-test','1');if(/[?&]big=0/.test(q))localStorage.removeItem('gmc-ts-test');}catch(_){}
var on=MODE==='on';try{on=on||localStorage.getItem('gmc-ts-test')==='1';}catch(_){}
if(!on)return;
var H=document.documentElement,lv=1;try{lv=+localStorage.getItem('gmc-ts')||1;}catch(_){}if(!(lv>=1&&lv<=3))lv=1;
function set(n){H.classList.remove('ts1','ts2','ts3');H.classList.add('ts'+n);lv=n;try{localStorage.setItem('gmc-ts',String(n));}catch(_){}}
set(lv);
function add(){var en=document.querySelector('button.lang,[onclick*="toggleLang"]');if(!en||document.getElementById('tsBtn'))return;
 var b=document.createElement('button');b.type='button';b.id='tsBtn';b.className='ts-btn';
 function lab(){b.textContent=['','가','가+','가++'][lv];b.setAttribute('aria-label','글자 크기: '+['','보통','크게','아주 크게'][lv]+'. 누르면 바뀝니다');}
 lab();b.onclick=function(){set(lv%3+1);lab();};en.parentNode.insertBefore(b,en);}
if(document.readyState!=='loading')add();else document.addEventListener('DOMContentLoaded',add);
})();</script><!-- /휴대폰 글자 --></head>
