<style>
:root{--color-background:#F6F1E7;--color-surface:#ffffff;--color-text-primary:#1c1f26;--color-text-secondary:#4a4f5a;
  --color-border:#E3D9C6;--color-primary:#14213d;--color-primary-hover:#1f2f55;--color-primary-foreground:#ffffff;--color-accent:#B8924A;
  --font-sans:"Pretendard Variable",Pretendard,"Geist",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:var(--color-background);color:var(--color-text-primary);font-family:var(--font-sans);line-height:1.6;word-break:keep-all}
main{max-width:520px;width:100%;background:var(--color-surface);border:1px solid var(--color-border);border-radius:16px;padding:36px 28px;text-align:center}
.mark{font-size:13px;letter-spacing:.12em;color:var(--color-accent);font-weight:600;margin:0 0 10px}
h1{font-size:24px;line-height:1.35;margin:0 0 12px}
p{font-size:16px;color:var(--color-text-secondary);margin:0 0 24px}
nav{display:flex;flex-direction:column;gap:10px}
a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;border-radius:12px;
  font-size:16px;font-weight:600;text-decoration:none;border:1px solid var(--color-border);color:var(--color-primary)}
a.main{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-primary-foreground)}
a:hover{border-color:var(--color-primary)}
a.main:hover{background:var(--color-primary-hover)}
a:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}
.en{font-size:14px;margin-top:20px;margin-bottom:0}
</style>
</head>

</main>
